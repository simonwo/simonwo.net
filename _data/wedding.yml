  title: Mosque visit
  location: Badshahi Mosque
  notes: > 
    Please note the timings are TBC as we will calculate timings according to prayer time, during which the mosque is closed to tourists.
    
    Badshahi Mosque is a Mughal-era imperial mosque located in Lahore, Punjab, Pakistan. It was constructed between 1671 and 1673 by the Mughal emperor Aurangzeb, opposite the Lahore Fort in the northern outskirts of the historic Walled City. It is widely considered to be an iconic landmark of the country.

