  title: Border ceremony
  start: "14:30"
  end: "16:30"
  location: Wagah Border
  notes: >
    (we will confirm closer to the time the exact timing and subsequent timings)
    
    The ceremony at the Attari-Wagah border is a daily ceremony that the security forces of India (Border Security Force) and Pakistan (Pakistan Rangers) have jointly followed since 1959. The drill is characterized by elaborate and rapid dance-like manoeuvres and raising legs as high as possible. It is symbolic of the brotherhood as well as the rivalry that these two nations share.

